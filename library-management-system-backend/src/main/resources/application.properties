spring.application.name=library-management-system

server.port=8081

# Database Configuration (Environment-based credentials)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration (Required via JWT_SECRET environment variable)
app.jwt.secret=${JWT_SECRET:}

# System Setup Configuration
app.setup.regenerate-token=${APP_SETUP_REGENERATE_TOKEN:false}
