spring.application.name=library-management-system-test

# Database Configuration for Tests
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/library_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}

# Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Test JWT Secret (at least 256-bit / 32 characters)
app.jwt.secret=test_jwt_secret_key_32_bytes_long_for_unit_tests_only

# System Setup Configuration
app.setup.regenerate-token=false

